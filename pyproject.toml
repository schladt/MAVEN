[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maven-cloud-memory"
version = "0.1.0"
description = "Owner-controlled cloud memory and explicit project workflows for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "boto3[crt]>=1.41.0,<2",
  "aws-encryption-sdk[MPL]>=4,<5",
  "requests>=2,<3",
  "packaging>=24,<27",
]

[project.optional-dependencies]
ui = ["textual>=2.1,<3"]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
maven-setup = "tools.setup:main"
maven-secrets = "tools.aws.secrets:main"
maven-secret-catalog = "tools.secret_catalog:main"
maven-project = "tools.project:main"
maven-uninstall = "tools.uninstall.cli:main"
maven-mcp = "tools.mcp.server:main"
maven-login = "tools.login:main"
maven-git = "tools.git_workflow:main"
maven-statusline = "tools.statusline:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["tools", "tools.*", "maven_resources"]

[tool.setuptools.package-data]
maven_resources = [
  "config/*.json", "templates/*.example", "templates/harness/*.md", "infra/memory/*.json",
  "templates/harness/maven-turn.js",
  "templates/skills/maven/SKILL.md",
  "templates/skills/maven/references/project.md", "templates/skills/maven/references/reconcile.md",
  "templates/skills/maven/references/secrets.md", "templates/skills/maven/references/update.md",
]
"tools.memory" = ["migrations/*.sql"]
