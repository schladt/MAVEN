[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maven-cloud-memory"
version = "0.1.0"
description = "Owner-controlled cloud memory and explicit project workflows for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "boto3[crt]>=1.41.0,<2",
  "aws-encryption-sdk[MPL]>=4,<5",
  "requests>=2,<3",
]

[project.optional-dependencies]
ui = ["textual>=2.1,<3", "packaging>=24,<27"]
google = ["google-auth-oauthlib>=1.2,<2", "google-api-python-client>=2,<3"]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
maven-setup = "tools.setup:main"
maven-memory = "tools.memory.cli:main"
maven-workspace = "tools.workspace:main"
maven-secrets = "tools.aws.secrets:main"
maven-google = "tools.google.cli:main"
maven-project = "tools.project:main"
maven-start-work = "tools.workflow:start_main"
maven-checkpoint = "tools.workflow:checkpoint_main"
maven-stop-work = "tools.workflow:stop_main"
maven-workflow = "tools.workflow:main"
maven-uninstall = "tools.uninstall.cli:main"
maven-mcp = "tools.mcp.server:main"
maven-git = "tools.git_workflow:main"
maven-statusline = "tools.statusline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools", "tools.*", "maven_resources"]

[tool.setuptools.package-data]
maven_resources = ["config/*.json", "templates/*.example", "templates/skills/*/SKILL.md", "templates/harness/*.md", "templates/authority/*.md", "templates/authority/*.json", "infra/memory/*.json"]
"tools.memory" = ["migrations/*.sql"]
